services:
  - type: web
    name: pdf-compressor-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://papperpress-online-frontend.vercel.app
